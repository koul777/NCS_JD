[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ncs-jd"
version = "0.1.4"
description = "NCS 근거가 추적되는 직무기술서·직무명세서 초안 생성기"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.scripts]
ncs-jd-team = "ncs_jd.team_cli:main"

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]
mcp = [
  "mcp>=1.0,<2",
]
dev = [
  "pytest>=7.4,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
